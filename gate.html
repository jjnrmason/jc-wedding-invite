<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Joshua &amp; Charlotte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f2ee;
      color: #111;
      font-family: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-align: center;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 48px 28px 44px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    img { width: 64px; height: auto; display: block; margin: 0 auto 28px; }
    h1 { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 14px; }
    p { margin: 0 0 26px; line-height: 1.6; font-size: 0.95rem; text-wrap: balance; }
    form { display: grid; gap: 14px; }
    input, button {
      font: inherit;
      letter-spacing: 0.12em;
      padding: 14px 18px;
      border: 1.5px solid #111;
      border-radius: 999px;
      text-align: center;
    }
    input { background: #fff; color: #111; }
    input:focus { outline: 2px solid #111; outline-offset: 2px; }
    button { background: #111; color: #fff; font-weight: 600; text-transform: uppercase; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    .error { min-height: 1.5em; margin: 14px 0 0; font-size: 0.85rem; color: #a01818; }
    .panel[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="panel" id="gate" hidden>
    <img src="__MONOGRAM__" alt="J &amp; C monogram">
    <h1>You’re invited</h1>
    <p>This page is just for our guests. Please open it using the link we sent you, or enter your invite code below.</p>
    <form id="form" autocomplete="off">
      <label for="code" style="position:absolute;left:-9999px">Invite code</label>
      <input id="code" name="code" placeholder="Invite code" autocapitalize="off" spellcheck="false" required>
      <button id="submit" type="submit">Open invitation</button>
    </form>
    <p class="error" id="error" role="alert"></p>
  </main>

  <script>
    (function () {
      var PAYLOAD = __PAYLOAD__;
      var STORE_KEY = 'jc-invite-code';

      var gate = document.getElementById('gate');
      var form = document.getElementById('form');
      var input = document.getElementById('code');
      var button = document.getElementById('submit');
      var error = document.getElementById('error');

      function normalise(code) { return (code || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
      function fromB64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
      function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }

      async function decrypt(code) {
        var subtle = window.crypto.subtle;
        var baseKey = await subtle.importKey('raw', new TextEncoder().encode(normalise(code)), 'PBKDF2', false, ['deriveKey']);
        var key = await subtle.deriveKey(
          { name: 'PBKDF2', salt: fromB64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
        );
        var plain = await subtle.decrypt({ name: 'AES-GCM', iv: fromB64(PAYLOAD.iv) }, key, fromB64(PAYLOAD.data));
        return new TextDecoder().decode(plain);
      }

      async function unlock(code) {
        try {
          var html = await decrypt(code);
        } catch (e) {
          return false;
        }
        store(function (s) { s.setItem(STORE_KEY, normalise(code)); });
        // Drop the code from the address bar so it isn't copied around by accident.
        history.replaceState(null, '', location.pathname + location.search);
        document.open();
        document.write(html);
        document.close();
        return true;
      }

      function showGate(message) {
        gate.hidden = false;
        error.textContent = message || '';
        if (!message) input.focus();
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        button.disabled = true;
        error.textContent = '';
        var ok = await unlock(input.value);
        if (!ok) {
          button.disabled = false;
          error.textContent = 'Sorry, that code doesn’t match. Please check your invite.';
          input.select();
        }
      });

      (async function () {
        if (!window.crypto || !window.crypto.subtle) {
          showGate('Your browser can’t open this invite. Please try a different browser.');
          return;
        }
        var fromLink = location.hash.slice(1);
        if (fromLink && await unlock(fromLink)) return;
        var remembered = store(function (s) { return s.getItem(STORE_KEY); });
        if (remembered && await unlock(remembered)) return;
        showGate(fromLink ? 'Sorry, that link doesn’t seem to be right. Please enter your invite code.' : '');
      })();
    })();
  </script>
</body>
</html>
